name: Brassmere independent AI review

on:
  pull_request:
    branches: [rts/isometric-conversion]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: brassmere-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    if: startsWith(github.head_ref, 'agent/') && !endsWith(github.head_ref, '-codex')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false
      - id: review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          prompt-file: orchestration/prompts/master-reviewer.md
      - uses: actions/github-script@v7
        env:
          REVIEW: ${{ steps.review.outputs.final-message }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- brassmere-review:codex:v1 -->\n${process.env.REVIEW}`
            });

  gemini-review:
    if: startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false
      - id: review
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: "Read orchestration/prompts/master-reviewer.md. Review PR #${{ github.event.pull_request.number }} read-only and return PASS, REWORK, or BLOCK with exact evidence. Do not modify files."
          upload_artifacts: false
      - uses: actions/github-script@v7
        env:
          REVIEW: ${{ steps.review.outputs.summary }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- brassmere-review:gemini:v1 -->\n${process.env.REVIEW}`
            });
